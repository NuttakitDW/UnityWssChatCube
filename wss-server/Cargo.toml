[package]
name = "wss-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix = "0.13"
actix-web = { version = "4", features = ["openssl"] }
actix-web-actors = "4"
openssl = "0.10"                                                    # For TLS support
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
